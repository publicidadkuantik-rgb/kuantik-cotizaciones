<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotización Kuantik · Mariana Serna</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:#f4f4f5;color:#111}
header{background:#000;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px}header img{height:34px}header div{font-size:13px;color:#939598}header b{color:#fff;display:block;font-size:15px}
main{max-width:860px;margin:0 auto;padding:14px}
.row{display:flex;gap:12px;background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;align-items:center;box-shadow:0 1px 3px #0001}
.row img,.ph{width:84px;height:84px;object-fit:contain;border-radius:8px;background:#fff;flex:none}.ph{display:flex;align-items:center;justify-content:center;background:#eee;color:#939598;font-size:11px;text-align:center}
.inf{flex:1;min-width:0}.inf h3{margin:0 0 2px;font-size:14px}.inf small{color:#939598}.pr{font-weight:800;color:#00A2AE;font-size:15px;margin-top:3px}
.btns{display:flex;flex-direction:column;gap:6px}button{font:600 13px Montserrat;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.ver{background:#00A2AE;color:#fff}.q{background:#fff;color:#9F2DBF;border:1.5px solid #9F2DBF}.q:hover{background:#9F2DBF;color:#fff}
.tot{position:sticky;bottom:0;background:#000;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.tot b{font-size:18px;color:#00A2AE}.tot small{color:#939598;display:block}
.rem{opacity:.5;filter:grayscale(1)}.optr{border:1.5px dashed #9F2DBF}.optr button.q{background:#9F2DBF;color:#fff}.optr.on2 button.q{background:#fff;color:#9F2DBF}.rem button.q{background:#9F2DBF;color:#fff}
#m{position:fixed;inset:0;background:#000b;display:none;overflow:auto;z-index:9}#m.on{display:block}
.card{background:#fff;max-width:640px;margin:20px auto;border-radius:16px;overflow:hidden}
.card .big{background:#fff;text-align:center;padding:16px}.card .big img{max-width:100%;max-height:380px;object-fit:contain}
.card .b{padding:6px 22px 22px}.card h2{margin:0 0 4px}.card .p{font-size:26px;font-weight:800;color:#00A2AE;margin:8px 0}
.card ul{padding-left:18px;line-height:1.55;font-size:14px}.x{float:right;background:#000;color:#fff;margin:10px}
.tag{display:inline-block;background:#9F2DBF;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px}
.fin{position:fixed;inset:0;background:#fff;display:none;overflow:auto;z-index:20}.fin.on{display:block}
.fp{max-width:900px;margin:0 auto;padding:18px;font-size:13px;color:#111}.fp h1{margin:0;font-size:22px}.fp .hd{display:flex;align-items:center;gap:14px;background:#000;color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:12px}.fp .hd img{height:34px}
.fp table{width:100%;border-collapse:collapse;margin:10px 0}.fp th{background:#000;color:#fff;padding:6px;font-size:12px;text-align:left}.fp td{border-bottom:1px solid #ddd;padding:6px;vertical-align:top}.fp td img{width:64px;height:64px;object-fit:contain}.fp ul{margin:2px 0 0;padding-left:16px;color:#444;font-size:12px}
.fp .tt{margin-left:auto;width:300px}.fp .tt div{display:flex;justify-content:space-between;padding:3px 0}.fp .tt .g{font-size:18px;font-weight:800;color:#00A2AE;border-top:2px solid #000;margin-top:4px;padding-top:6px}
.fp .cond{font-size:12px;line-height:1.5;margin-top:16px}.fp .cond h3{margin:10px 0 2px;font-size:13px}.fp .acts{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.big{font:800 17px Montserrat;background:#00A2AE;color:#fff;padding:14px 26px;border-radius:12px;border:0;cursor:pointer}.big2{font:700 15px Montserrat;background:#000;color:#fff;padding:12px 22px;border-radius:10px;border:0;cursor:pointer}.gry{background:#fff;color:#000;border:1.5px solid #000}
@media print{body>*:not(#fin){display:none!important}.fin{position:static;display:block!important;overflow:visible}.acts{display:none!important}.fp td,.fp tr{break-inside:avoid}}
.sec{font-size:15px;margin:18px 2px 8px;color:#9F2DBF}</style></head><body>

<template id="cond"><h3>1. Vigencia</h3>La cotización tiene una vigencia de 8 días calendario.
<h3>2. Condiciones de pago</h3>Forma de pago: PAGO ANTICIPADO. En caso de aplicarse descuentos, promociones o beneficios comerciales, el pago deberá realizarse únicamente en efectivo o transferencia bancaria. No aplica pago con datáfono en estos casos.
<h3>3. Tiempo de entrega</h3>Tiempo estimado de entrega: en promedio 15 días (el tiempo comienza a contar a partir de la confirmación del pago). En productos de importación o sobrepedido, el tiempo dependerá del importador.
<h3>4. Lugar de entrega</h3>☐ Punto de venta &nbsp; ☐ Dirección del cliente: ______________________. Si es en la ciudad de Manizales no se cobra el domicilio.
<h3>5. Productos sin cambio ni devolución</h3>No se aceptan cambios ni devoluciones en: productos fabricados a medida; productos personalizados; productos incluidos en las políticas y condiciones; productos solicitados bajo modalidad de sobrepedido o importación especial.
<h3>6. Instalación (si aplica)</h3>¿Requiere instalación? ☐ Sí &nbsp; ☐ No. En caso afirmativo: la instalación se programará cuando la totalidad de los productos de la orden se encuentren disponibles. Para realizar la instalación, la factura deberá estar pagada en su totalidad. En órdenes con varios productos, la instalación se realizará en una sola visita y de manera integral, salvo acuerdo diferente por escrito.
<h3>7. Garantía</h3>Garantía de fábrica según el producto y el fabricante. No aplica por mal uso, manipulación indebida o desgaste natural, o resistencias.
<h3>Condiciones específicas</h3>Entrega en Manizales/Villamaría sin costo · Garantía de 1 año en la máquina Smith · Sin instalación · Precios de la cotización anterior sin cambios.<h3>Nota – Confirmación y disponibilidad</h3>La disponibilidad definitiva de los productos solo se confirma una vez recibido el pago y su respectivo soporte. Hasta ese momento, Kuantik no garantiza existencia. Si al verificarse el pago el producto no se encuentra disponible, se informará al cliente y se realizará la devolución total del valor.
